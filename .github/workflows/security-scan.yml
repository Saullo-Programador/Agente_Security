name: Radar de Seguranca

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:00 UTC toda segunda = 06:00 em Brasilia
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      repo_url:
        description: "URL de um repositorio publico do GitHub para auditar (deixe vazio para auditar este repositorio)"
        required: false
        default: ""

permissions:
  contents: write
  security-events: write

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio (historico completo, necessario para o gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir o que sera escaneado
        id: scandir
        run: |
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            echo "dir=target" >> "$GITHUB_OUTPUT"
            echo "label=${{ github.event.inputs.repo_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "label=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar repositorio alvo (somente se um link foi informado)
        if: github.event.inputs.repo_url != ''
        run: git clone --quiet "${{ github.event.inputs.repo_url }}" target

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias do agente
        run: pip install -r requirements.txt

      # ---------- Gitleaks: segredos vazados no historico do git ----------
      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          VERSION_NUM="${GITLEAKS_VERSION#v}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${VERSION_NUM}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Preparar pasta dos SARIFs (aba Security do GitHub)
        run: mkdir -p sarif-results

      - name: Rodar gitleaks
        run: gitleaks detect --source "${{ steps.scandir.outputs.dir }}" --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --no-banner || true

      - name: Gerar SARIF do gitleaks
        run: gitleaks detect --source "${{ steps.scandir.outputs.dir }}" --config .gitleaks.toml --report-format sarif --report-path sarif-results/gitleaks.sarif --no-banner || true

      # ---------- Semgrep: analise estatica de codigo (SAST) ----------
      # Conjuntos curados de regras (OWASP Top 10, CWE Top 25, auditoria geral)
      # em vez do --config=auto generico - cobertura mais rigorosa e reconhecida.
      - name: Rodar semgrep
        run: semgrep --config=p/owasp-top-ten --config=p/cwe-top-25 --config=p/security-audit --json --output=semgrep-report.json "${{ steps.scandir.outputs.dir }}" || true

      - name: Gerar SARIF do semgrep
        run: semgrep --config=p/owasp-top-ten --config=p/cwe-top-25 --config=p/security-audit --sarif --output=sarif-results/semgrep.sarif "${{ steps.scandir.outputs.dir }}" || true

      # ---------- Dependencias vulneraveis (SCA ampliada) ----------
      # Trivy cobre bem mais ecossistemas que pip-audit/npm audit sozinhos -
      # inclui Python, Node, Dart/Flutter (pubspec.lock), Go, Docker, etc.
      - name: Rodar trivy (relatorio em json)
        # Pinado pelo commit (nao pela tag) por seguranca: em marco/2026 o
        # trivy-action sofreu um ataque de supply chain onde quase todas as
        # tags de versao foram reescritas com um roubador de credenciais.
        # ed142fd = v0.36.0, versao publicada e verificada apos o incidente.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: ${{ steps.scandir.outputs.dir }}
          format: json
          output: trivy-report.json
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Gerar SARIF do trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: ${{ steps.scandir.outputs.dir }}
          format: sarif
          output: sarif-results/trivy.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Enviar achados para a aba Security do GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: radar-seguranca

      # ---------- Agregar + IA prioriza e traduz ----------
      - name: Agregar achados
        run: python scripts/aggregate.py

      - name: Resumir com IA e montar relatorio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_LABEL: ${{ steps.scandir.outputs.label }}
        run: python scripts/summarize.py

      - name: Commitar relatorio no repositorio
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "radar-seguranca-bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Relatorio de seguranca $(date -u +%Y-%m-%d)"
          git push

      - name: Falhar o job se houver achado critico
        run: python scripts/gate.py